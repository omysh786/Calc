  <style id="base-css">
    :root {
      --primary: #0f766e;
      --primary-hover: #0d9488;
      --secondary: #0ea5e9;
      --accent: #d97706;
      --bg: #f4f7f7;
      --bg-alt: #e8f0ef;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #5b677a;
      --border: #d7e2e0;
      --header: #ffffff;
      --footer: #0b1f1e;
      --footer-text: #e2eeec;
      --btn: #0f766e;
      --btn-text: #ffffff;
      --danger: #dc2626;
      --success: #059669;
      --warning: #d97706;
      --shadow: 0 12px 40px rgba(15, 23, 42, .08);
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, .06);
      --radius: 16px;
      --radius-sm: 10px;
      --space: 1rem;
      --container: 1180px;
      --header-h: 72px;
      --fs-body: 16px;
      --fs-h1: clamp(2rem, 5vw, 3.4rem);
      --fs-h2: clamp(1.5rem, 3vw, 2rem);
      --fs-btn: 15px;
      --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --focus: 0 0 0 3px color-mix(in srgb, var(--primary) 35%, transparent);
      --ease: 180ms cubic-bezier(.2, .7, .2, 1);
    }
    html[data-theme="dark"] {
      --bg: #071112;
      --bg-alt: #0e1a1b;
      --card: #102022;
      --text: #e8f2f1;
      --muted: #93a8a6;
      --border: #1e3536;
      --header: #0b1819;
      --footer: #050c0d;
      --footer-text: #d5e6e4;
      --shadow: 0 12px 40px rgba(0, 0, 0, .35);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      font-size: var(--fs-body);
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
      min-height: 100dvh;
    }
    img { max-width: 100%; height: auto; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--primary); text-underline-offset: 3px; }
    :focus-visible { outline: none; box-shadow: var(--focus); }
    .skip-link {
      position: absolute; left: 12px; top: -40px; z-index: 10000;
      background: var(--primary); color: #fff; padding: 8px 12px; border-radius: 8px;
    }
    .skip-link:focus { top: 12px; }
    .container { width: min(100% - 32px, var(--container)); margin-inline: auto; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* Header */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      height: var(--header-h);
      background: color-mix(in srgb, var(--header) 92%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .site-header.is-static { position: relative; }
    .header-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 750; letter-spacing: -.02em; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
      background: linear-gradient(145deg, var(--primary), color-mix(in srgb, var(--primary) 50%, var(--accent)));
      color: #fff; box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 35%, transparent);
    }
    .nav-links { display: flex; gap: 6px; align-items: center; }
    .nav-links a {
      text-decoration: none; color: var(--text); padding: 8px 12px; border-radius: 999px; font-weight: 600; font-size: 14px;
    }
    .nav-links a:hover { background: var(--bg-alt); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 42px; height: 42px; border: 1px solid var(--border); background: var(--card);
      border-radius: 12px; display: grid; place-items: center; color: var(--text);
    }
    .hamburger { display: none; }
    .mobile-drawer {
      display: none; position: fixed; inset: var(--header-h) 0 0 0; background: var(--card);
      z-index: 45; padding: 20px; border-top: 1px solid var(--border);
    }
    .mobile-drawer.open { display: flex; flex-direction: column; gap: 8px; }
    .mobile-drawer a { text-decoration: none; color: var(--text); padding: 14px 12px; border-radius: 12px; font-weight: 650; }
    .mobile-drawer a:hover { background: var(--bg-alt); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; border-radius: 999px; padding: 12px 20px; font-size: var(--fs-btn); font-weight: 700;
      text-decoration: none; transition: transform var(--ease), box-shadow var(--ease), background var(--ease);
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--btn); color: var(--btn-text); box-shadow: 0 10px 22px color-mix(in srgb, var(--btn) 30%, transparent); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
    .btn-block { width: 100%; }

    /* Hero */
    .hero {
      position: relative; overflow: hidden; padding: 64px 0 40px;
      background:
        radial-gradient(900px 420px at 10% -10%, color-mix(in srgb, var(--primary) 18%, transparent), transparent 60%),
        radial-gradient(700px 380px at 100% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 55%),
        var(--bg);
    }
    .hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 36px; align-items: center; }
    .hero h1 { font-size: var(--fs-h1); line-height: 1.12; letter-spacing: -.035em; margin: 0 0 14px; }
    .hero .lede { font-size: 1.15rem; color: var(--muted); max-width: 52ch; margin: 0 0 28px; }
    .hero-cta { display: flex; flex-wrap: wrap; gap: 10px; }
    .hero-card {
      background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) + 6px);
      box-shadow: var(--shadow); padding: 22px;
    }
    .hero-kicker { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin-bottom: 12px; }

    /* Ads */
    .ad-slot { margin: 18px auto; width: min(100% - 32px, var(--container)); }
    .ad-frame {
      min-height: 0; border: 1px dashed var(--border); border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--bg-alt) 70%, var(--card));
      display: grid; place-items: center; overflow: auto; padding: 8px;
    }
    .ad-frame:empty { display: none; }
    .ad-label { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 6px; letter-spacing: .06em; text-transform: uppercase; }

    /* Calculator */
    #calculator { padding: 20px 0 10px; }
    .calc-wrap {
      display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; align-items: start;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); padding: 22px;
    }
    .card h2, .section-head h2 { font-size: var(--fs-h2); letter-spacing: -.03em; margin: 0 0 8px; }
    .label { display: block; font-weight: 700; font-size: 13px; margin: 14px 0 8px; }
    .field {
      width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: 12px; padding: 12px 14px; outline: none;
    }
    .field:focus { border-color: var(--primary); box-shadow: var(--focus); }
    .bill-input { font-size: 28px; font-weight: 750; letter-spacing: -.03em; padding: 16px 16px; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: 999px; padding: 10px 14px; font-weight: 700; min-width: 52px;
    }
    .pill[aria-pressed="true"], .seg[aria-pressed="true"] {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }
    .seg-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .seg {
      border: 1px solid var(--border); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-weight: 650;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .error-msg { color: var(--danger); font-size: 13px; font-weight: 650; min-height: 1.2em; margin-top: 6px; }

    .results-card { position: sticky; top: calc(var(--header-h) + 16px); }
    .empty-state { text-align: center; padding: 28px 10px; color: var(--muted); }
    .empty-state svg { margin-bottom: 8px; }
    .result-total { font-size: 2rem; font-weight: 800; letter-spacing: -.04em; }
    .result-rows { display: grid; gap: 10px; margin: 16px 0; }
    .result-row { display: flex; justify-content: space-between; gap: 12px; font-weight: 650; }
    .result-row span:last-child { font-variant-numeric: tabular-nums; }
    .breakdown { display: grid; gap: 8px; margin: 16px 0; }
    .bar-track { height: 10px; background: var(--bg-alt); border-radius: 999px; overflow: hidden; display: flex; }
    .bar-seg { height: 100%; transition: width 500ms ease; }
    .bar-sub { background: var(--primary); }
    .bar-tax { background: var(--secondary); }
    .bar-tip { background: var(--accent); }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .swatch { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 6px; }
    .result-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .save-line { font-size: 13px; color: var(--success); font-weight: 650; margin-top: 8px; }

    /* Content sections */
    .section { padding: 56px 0; }
    .section.alt { background: var(--bg-alt); }
    .section-head { max-width: 640px; margin: 0 auto 28px; text-align: center; }
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .step { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); }
    .step-n {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      background: color-mix(in srgb, var(--primary) 12%, var(--card)); color: var(--primary); font-weight: 800; margin-bottom: 10px;
    }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .feature { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .feature svg { color: var(--primary); margin-bottom: 8px; }
    .seo-article { max-width: 760px; margin: 0 auto; }
    .seo-article h2 { margin-top: 1.6em; }
    .seo-article h3 { margin-top: 1.2em; }
    .faq-list { max-width: 760px; margin: 0 auto; display: grid; gap: 10px; }
    .faq-item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .faq-item button {
      width: 100%; text-align: left; background: none; border: 0; padding: 16px 18px;
      font-weight: 750; display: flex; justify-content: space-between; gap: 12px; color: var(--text);
    }
    .faq-item .faq-a { display: none; padding: 0 18px 16px; color: var(--muted); }
    .faq-item.open .faq-a { display: block; }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .site-footer { background: var(--footer); color: var(--footer-text); padding: 48px 0 20px; }
    .footer-grid { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr); gap: 28px; }
    .site-footer a { color: inherit; text-decoration: none; opacity: .9; }
    .site-footer a:hover { text-decoration: underline; }
    .footer-links { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .footer-bottom { margin-top: 28px; padding-top: 16px; border-top: 1px solid color-mix(in srgb, #fff 12%, transparent); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; opacity: .85; }
    .socials { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Cookie */
    .cookie {
      position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 80;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow); padding: 16px; max-width: 560px;
    }
    .cookie-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    /* Legal */
    .legal-page { max-width: 760px; margin: 40px auto 80px; padding: 0 16px; }
    .legal-page h1 { letter-spacing: -.03em; }
    .legal-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 28px; }
    .legal-tabs button {
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      border-radius: 999px; padding: 10px 16px; font-weight: 700; min-height: 44px;
    }
    .legal-tabs button[aria-selected="true"] {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }
    .legal-panel { display: none; max-width: 760px; margin: 0 auto; }
    .legal-panel.is-on { display: block; }
    .legal-panel h2 { margin-top: 0; letter-spacing: -.03em; }
    .legal-panel h3 { margin-top: 1.25em; }
    .legal-panel ul { padding-left: 1.2em; }
    .legal-note { font-size: 13px; color: var(--muted); margin-top: 28px; text-align: center; }
    .admin-legal-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .admin-legal-tabs button { background: #132033; border: 1px solid #24344c; color: #c9d4e5; border-radius: 999px; padding: 8px 12px; font-weight: 700; }
    .admin-legal-tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Admin */
    #admin-root { position: fixed; inset: 0; z-index: 90; background: #0b1220; color: #e8eef7; display: grid; grid-template-columns: 260px 1fr; }
    .admin-side { background: #07101c; border-right: 1px solid #1e2a3c; display: flex; flex-direction: column; min-height: 0; }
    .admin-brand { padding: 18px 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .admin-search { margin: 0 12px 10px; }
    .admin-search input { width: 100%; background: #0e1a2b; border: 1px solid #24344c; color: #fff; border-radius: 10px; padding: 10px 12px; }
    .admin-nav { overflow: auto; padding: 6px; display: grid; gap: 2px; }
    .admin-nav button {
      background: transparent; border: 0; color: #c9d4e5; text-align: left; padding: 10px 12px;
      border-radius: 10px; font-weight: 650; display: flex; gap: 8px; align-items: center;
    }
    .admin-nav button.active, .admin-nav button:hover { background: #143047; color: #fff; }
    .admin-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #0f172a; }
    .admin-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #1e2a3c; }
    .admin-body { overflow: auto; padding: 20px; }
    .admin-login { position: fixed; inset: 0; z-index: 95; background: #071018; display: grid; place-items: center; padding: 20px; }
    .login-card { width: min(100%, 420px); background: #101b2c; border: 1px solid #24344c; border-radius: 18px; padding: 28px; color: #e8eef7; }
    .dash-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .dash-card { background: #132033; border: 1px solid #24344c; border-radius: 14px; padding: 16px; }
    .dash-card .n { font-size: 1.6rem; font-weight: 800; }
    .chart { display: flex; align-items: end; gap: 8px; height: 180px; padding: 12px; background: #132033; border-radius: 14px; border: 1px solid #24344c; }
    .chart-bar { flex: 1; background: linear-gradient(#14b8a6, #0f766e); border-radius: 8px 8px 4px 4px; min-height: 4px; position: relative; }
    .chart-bar span { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #9bb; }
    .form-grid { display: grid; gap: 12px; }
    .form-grid.two { grid-template-columns: 1fr 1fr; }
    .admin-field label { display: block; font-size: 12px; font-weight: 750; margin-bottom: 6px; color: #b7c4d6; }
    .admin-field input, .admin-field select, .admin-field textarea {
      width: 100%; background: #0b1624; border: 1px solid #2a3c56; color: #fff; border-radius: 10px; padding: 10px 12px;
    }
    .admin-field textarea { min-height: 90px; font-family: var(--mono); font-size: 12px; }
    .admin-field textarea[data-path*="legal."] { min-height: 320px; }
    .toggle { display: flex; align-items: center; gap: 8px; }
    .switch { width: 42px; height: 24px; border-radius: 99px; background: #334155; position: relative; border: 0; }
    .switch.on { background: var(--primary); }
    .switch i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: left .16s; }
    .switch.on i { left: 21px; }
    .warn { background: #3b2a12; border: 1px solid #92621d; color: #f3d9a6; padding: 12px 14px; border-radius: 12px; font-size: 13px; }
    .oknote { background: #10291f; border: 1px solid #1f6b4a; color: #b7f0d3; padding: 12px 14px; border-radius: 12px; font-size: 13px; }
    .builder-item {
      display: flex; align-items: center; gap: 10px; background: #132033; border: 1px solid #24344c;
      border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: grab;
    }
    .builder-item:active { cursor: grabbing; }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #1e3a3a; color: #9ee7d8; }
    .serp-preview { background: #fff; color: #202124; border-radius: 12px; padding: 16px 18px; max-width: 640px; }
    .serp-preview .s-url { color: #202124; font-size: 14px; }
    .serp-preview .s-title { color: #1a0dab; font-size: 20px; line-height: 1.3; margin: 4px 0; }
    .serp-preview .s-desc { color: #4d5156; font-size: 14px; }
    .char-count { font-size: 12px; color: #9bb; margin-top: 4px; }
    .admin-h { margin: 22px 0 10px; font-size: 1.05rem; }
    .check-list { margin: 0; padding-left: 18px; color: #c9d4e5; }
    .check-list li { margin: 6px 0; }
    .preview-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 88; background: #0f766e; color: #fff;
      display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; font-weight: 700;
    }

    /* Toasts / modal */
    #toast-root { position: fixed; right: 16px; bottom: 16px; z-index: 120; display: grid; gap: 8px; }
    .toast { background: #0f172a; color: #fff; padding: 12px 14px; border-radius: 12px; box-shadow: var(--shadow); min-width: 220px; }
    .toast.ok { background: #065f46; }
    .toast.err { background: #9f1239; }
    .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 110; display: grid; place-items: center; padding: 16px; }
    .modal { background: var(--card); color: var(--text); border-radius: 16px; padding: 22px; width: min(100%, 460px); border: 1px solid var(--border); }

    .share-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    @media (max-width: 1024px) {
      .hero-grid, .calc-wrap, .contact-grid, .footer-grid, .dash-cards { grid-template-columns: 1fr 1fr; }
      .steps { grid-template-columns: 1fr 1fr; }
      .features { grid-template-columns: 1fr 1fr; }
      #admin-root { grid-template-columns: 84px 1fr; }
      .admin-nav button { justify-content: center; font-size: 0; }
      .admin-brand span, .admin-search { display: none; }
    }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: grid; }
      .hero-grid, .calc-wrap, .contact-grid, .footer-grid, .steps, .features, .row-2, .form-grid.two, .dash-cards { grid-template-columns: 1fr; }
      .hero { padding: 36px 0 24px; }
      .results-card { position: static; }
      .bill-input { font-size: 22px; }

    seoContent: {
      enabled: true,
      title: "Guides",
      subtitle: "Clear answers for everyday tipping questions.",
      blocks: [
        { id: "what", title: "What is a tip calculator?", html: "<p>A tip calculator turns a restaurant bill into a clear breakdown: tax, gratuity, the grand total and — if you are sharing — the amount each person owes. It removes the mental arithmetic that usually happens at the end of a meal, when the receipt is already on the table.</p><p>This tool is designed for sit-down restaurants, cafés, takeaway with a tip line, and any service where a percentage of the bill is customary. It does not process payments and it does not store your bill on a server.</p>" },
        { id: "howcalc", title: "How to calculate a tip", html: "<p>Start with the food and drink subtotal. Multiply that amount by the tip percentage you want to leave, then divide by 100. Add tax if it is listed separately. The result is what you actually pay.</p><p>Example: a $80 subtotal with an 18% tip is 80 × 0.18 = $14.40. If sales tax is 8%, tax is $6.40. Grand total: $100.80. If four people split evenly, each pays $25.20.</p>" },
        { id: "howmuch", title: "How much should you tip?", html: "<p>Customs vary by country and by type of service. In the United States, 15–20% of the pre-tax bill is a common range for full-service restaurants, with 18–20% typical when service was good. Bars, delivery and salons often use different norms. In much of Europe, a service charge may already be included; an extra 5–10% is a thank-you rather than an obligation. When you travel, follow the local receipt and ask the venue if you are unsure.</p><p>This calculator does not tell you what you “must” leave. It simply makes the percentage you choose easy to split accurately.</p>" },
        { id: "split", title: "How to split a restaurant bill", html: "<p>The fairest even split is: (subtotal + tax + tip) ÷ number of people. If one guest ordered significantly more, calculate their items separately and split the remainder. This page supports any party size, including custom counts beyond the quick buttons.</p><p>When paying in cash, rounding the grand total to the nearest 1, 5 or 10 avoids a pile of coins. Card payments can keep the exact cents.</p>" },

        { id: "t15", title: "How to calculate a 15% tip", html: "<p>Move the decimal point of the bill one place left to get 10%, then take half of that for 5%, and add them. A $64 bill: 10% is $6.40, 5% is $3.20, 15% is $9.60. Or type 15 into this calculator and let it handle tax and splitting.</p>" },
        { id: "t18", title: "How to calculate an 18% tip", html: "<p>Ten percent plus 8 percent, or 20% minus 2%. On $50, 10% is $5 and 8% is $4, so 18% is $9. An 18% default is common on many card terminals in North America.</p>" },

      title: "Legal",
      subtitle: "How this site handles privacy, terms, cookies, advertising and liability.",
      privacy: { title: "Privacy Policy", html: "<p>Last updated: 6 October 2026.</p><p>This Privacy Policy explains how Smart Tip Calculator (this website) handles information. It is a generic template for the site operator to customize. It is not legal advice.</p><h3>Who we are</h3><p>This site is a free browser tool for estimating restaurant tips, tax and bill splits. It is a single HTML page. It does not require an account.</p><h3>What the calculator does not collect</h3><p>Bill amounts, tip percentages, tax rates and party size that you type stay in your browser for the calculation. The calculator does not send those figures to a server of ours, does not ask for your name or payment card, and does not need cookies to do the math.</p><h3>Information that may be stored on your device</h3><ul><li>Theme and display preferences (for example light or dark mode).</li><li>Anonymous local usage counters labeled as local browser statistics, if that feature is enabled. These are not unique-visitor counts for the whole internet.</li><li>Cookie/consent choices, if you use the privacy notice.</li><li>Administrator settings, only if someone signs in to the local admin tools on that same browser.</li></ul><p>You can clear this data with your browser’s site-data controls.</p><h3>Contact form</h3><p>If you submit the inquiry form, we receive only what you type (typically name, email, subject and message). If no form endpoint is configured, your device may open a mailto draft instead. Do not send passwords or payment details through this form.</p><h3>Analytics</h3><p>If the operator enables Google Analytics 4 and you allow analytics in the consent notice, Google may collect device and usage data under Google’s own policy. Events this site may send are limited to things such as page_view, calculator_used, tip_calculated, share_clicked and copy_clicked. We do not intentionally send names, emails or bill amounts to Analytics.</p><h3>Advertising</h3><p>If ads are enabled, third-party       terms: { title: "Terms of Use", html: "<p>Last updated: 6 October 2026.</p><p>These Terms of Use are a starting template for Smart Tip Calculator. They are not legal advice. The site operator should review them for the country where they operate.</p><h3>Agreement</h3><p>By using this website you agree to these Terms and to the Privacy Policy, Cookie Policy, Disclaimer and Advertising Disclosure. If you do not agree, do not use the site.</p><h3>The service</h3><p>Smart Tip Calculator provides estimated tip, tax, total and per-person amounts for convenience. Results may be rounded. Currency formatting follows the selected currency where the browser supports it. The site is provided free of charge, as-is, and as-available. We do not process restaurant payments.</p><h3>No professional advice</h3><p>Nothing on this site is tax, legal, financial, accounting or employment advice. Tipping customs and tax rules differ by place. Always check the printed receipt and local practice before you pay.</p><h3>Acceptable use</h3><ul><li>Use the calculator for personal, lawful estimates.</li><li>Do not attempt to disrupt the site, inject malicious code, or bypass the local admin tools.</li><li>Do not use results to create fraudulent receipts or to mislead a business or guest.</li><li>Do not paste unlawful content into public forms.</li></ul><h3>Accounts</h3><p>Ordinary use does not require an account. Any administrator login is a local, browser-side control for this file. It is not a hosted user account and is not a substitute for server-side authentication.</p><h3>Intellectual property</h3><p>The name, layout and text of this website belong to the operator except where third-party licenses apply. You may use the calculator; you may not copy the site and present it as your own product without permission.</p><h3>Third-party services</h3><p>Optional analytics, advertising, fonts or form endpoints are provided by others. Their terms apply to those services. We are not responsible for third-party outages or policies.</p><h3>Disclaimer of warranties</h3><p>The site is provided without warranties of any kind, express or implied, including fitness for a particular purpose and non-infringement, to the extent permitted by law. We do not warrant that figures are error-free.</p><h3>Limitation of liability</h3><p>To the extent permitted by law, the operator is not liable for overpayment, underpayment, service disputes, lost data, or any indirect or consequential loss arising from use of the calculator or the site.</p><h3>Changes</h3><p>We may update these Terms by changing this page. The date above will be revised when that happens.</p><h3>Contact</h3><p>Questions about these Terms can be sent through the Contact form or the footer email if one is listed.</p>" },
      cookies: { title: "Cookie Policy", html: "<p>Last updated: 6 October 2026.</p><p>This Cookie Policy describes how Smart Tip Calculator uses cookies and similar storage. It is a template for the operator to finish. It is not legal advice.</p><h3>What cookies are</h3><p>Cookies are small text files a site or its partners can store on your device. This page also uses browser localStorage for some preferences. localStorage is not a cookie, but we describe it here because it is similar from a privacy point of view.</p><h3>The calculator does not need cookies</h3><p>You can calculate a tip, split a bill, copy the result and print without accepting cookies. Arithmetic runs in your browser.</p><h3>Storage we may use</h3><ul><li><strong>Strictly useful on-device data:</strong> theme, consent choice, and calculator preferences in localStorage so the page remembers how you left it.</li><li><strong>Local statistics:</strong> anonymous page-load and calculator-use counts stored only in your browser, clearly labeled as local estimates — not site-wide unique visitors.</li><li><strong>Analytics cookies:</strong> only if Google Analytics 4 is enabled and you allow analytics.</li><li><strong>Advertising cookies:</strong> only if ad code is enabled and you allow advertising.</li></ul><h3>Your choices</h3><p>The privacy notice (when shown) offers Accept, Reject and Settings. Reject turns off non-essential analytics and ads for this browser. You can also block cookies in your browser or clear site data. Essential on-device preferences may still be needed for theme and the notice itself.</p><h3>Third parties</h3><p>Google, Adsterra or other networks, if enabled, set their own cookies under their own policies. This site does not control those companies’ retention or ads personalization.</p><h3>Do-not-track</h3><p>Browsers send Do Not Track signals inconsistently. We honour the choices you make in this site’s notice.</p><h3>Changes</h3><p>If cookie use changes (for example if the operator enables Analytics), this policy and the notice should be updated. Check the date above.</p>" },
      disclaimer: { title: "Disclaimer", html: "<p>Last updated: 6 October 2026.</p><p>Please read this Disclaimer before relying on any number this site produces. It is a general notice, not legal advice.</p><h3>Estimates only</h3><p>Smart Tip Calculator is a convenience tool. It estimates tip, tax, total and per-person amounts from the figures you enter. It does not know whether service charge is already included, whether tax is VAT or sales tax, or what a venue expects you to leave.</p><h3>Tipping is local</h3><p>Customs vary by country, city and type of service. A percentage that is typical in one place may be unusual in another. This site does not tell you what you must pay.</p><h3>Rounding and currency</h3><p>Optional rounding to the nearest 1, 5 or 10 changes the total. Some currencies use no decimal places. Displayed symbols depend on your browser. Confirm the amount on the official bill and payment terminal.</p><h3>No tax, legal or financial advice</h3><p>Tax percentages you type are not a tax filing. Nothing here is legal, accounting or employment advice.</p><h3>No payment processing</h3><p>We do not charge your card, contact the restaurant, or split payments between guests. How you actually pay is between you and the venue.</p><h3>Availability</h3><p>The page may be unavailable, blocked, or behave differently in older browsers. Offline use works only after the file has loaded.</p><h3>Third-party content</h3><p>Advertisements, analytics and outbound links belong to other parties. We are not responsible for their content, charges or data practices.</p><h3>Limitation</h3><p>To the fullest extent permitted by law, the operator is not liable for overpayment, underpayment, embarrassment, disputes with staff or guests, or any loss arising from use of these estimates. Use the tool at your own judgment.</p>" },
      ads: { title: "Advertising Disclosure", html: "<p>Last updated: 6 October 2026.</p><p>This Advertising Disclosure describes how ads may appear on Smart Tip Calculator. It is not legal advice and it is not an ad-network contract.</p><h3>When ads are shown</h3><p>This file can display advertisements only if the operator pastes approved code into the administrator tools and enables a slot. By default, ad slots are empty and turned off. If you see no ads, none are configured.</p><h3>Networks</h3><p>Supported options include Google AdSense, Adsterra, and custom HTML. Each network requires its own account, review and approval. Do not paste code until that approval exists.</p><h3>How ads are labeled</h3><p>Enabled slots use a short Advertisement label above the unit. Ads are placed in dedicated regions (for example above or below the calculator, in content, or near the footer) — not on top of Calculate, Copy, Share or payment-like buttons — so accidental clicks are less likely.</p><h3>What this site does not do</h3><ul><li>It does not generate fake clicks, impressions or traffic.</li><li>It does not hide ads as calculator buttons.</li><li>It does not sell your bill amount to advertisers (the calculator does not send bill figures to our server).</li></ul><h3>Consent</h3><p>Where advertising cookies or similar identifiers require consent, use Reject or the Settings choices in the privacy notice. If you reject advertising, ad slots should stay empty even if the operator enabled them.</p><h3>Third-party policies</h3><p>Advertisers and networks collect data under their own policies. Their ads may be personalized or contextual depending on your choices and their systems. We do not control every creative that a network may serve after approval.</p><h3>Operator responsibility</h3><p>The site operator is responsible for using only legitimate ad code, for keeping calculator controls separate from ads, and for complying with the network’s rules and local advertising law.</p>" }

  function resultsInner() {

      '<div class="result-total">' + esc(formatMoney(r.total)) + "</div>" +

      '<div class="legend"><span><i class="swatch" style="background:var(--primary)"></i>Subtotal</span><span><i class="swatch" style="background:var(--secondary)"></i>Tax</span><span><i class="swatch" style="background:var(--accent)"></i>Tip</span></div></div>' +

  function footerHtml() {

        return "<li><a href=\"" + esc(safeUrl(l.href)) + "\">" + esc(l.label) + "</a></li>";

      "<div><strong>" + esc(state.cfg.site.logoText) + "</strong><p>" + esc(f.description) + "</p>" +
      (f.email ? "<p>" + esc(f.email) + "</p>" : "") + (f.phone ? "<p>" + esc(f.phone) + "</p>" : "") + (f.address ? "<p>" + esc(f.address) + "</p>" : "") +
      "<p class=\"muted\">" + esc(f.contactText) + '</p><div class="socials">' + social + "</div></div>" + cols +
      '</div><div class="footer-bottom"><span>' + esc(f.copyright) + "</span><span>Calculator works offline · Ads &amp; analytics need a network</span></div></div></footer>";

      results: resultsHtml,
      "ad-below": function () { return renderAd("AD_SLOT_BELOW_CALCULATOR") + '<div id="ad-results-slot">' + renderAd("AD_SLOT_RESULTS") + "</div>"; },
      "how-it-works": howHtml,
      features: featuresHtml,
      "ad-content": function () { return renderAd("AD_SLOT_CONTENT"); },
      seo: seoHtml,
      faq: faqHtml,
      contact: contactHtml,
      "legal-pages": legalHtml,
      "ad-footer": function () { return renderAd("AD_SLOT_FOOTER"); }
    };
  }

  function renderPublic() {
    var cfg = state.cfg;
    el("logo-text").textContent = cfg.site.logoText;
    el("logo-icon").innerHTML = iconCalc();
    el("nav-links").innerHTML = navHtml(false);
    el("mobile-drawer").innerHTML = navHtml(true);
    el("theme-toggle").innerHTML = document.documentElement.getAttribute("data-theme") === "dark" ? iconSun() : iconMoon();
    var map = layoutMap();
    var html = "";
    var layout = cfg.layout.filter(function (sec) { return sec.enabled && sec.id !== "header" && sec.id !== "footer"; });
    for (var i = 0; i < layout.length; i++) {
      var id = layout[i].id;
      var next = layout[i + 1] ? layout[i + 1].id : "";
      if (id === "calculator" && next === "results") {
        html += calcPairHtml();
        i++;
        continue;
      }
      if (map[id]) html += map[id]() || "";
      else if (id.indexOf("ad-extra-") === 0) html += renderAd(id.replace("ad-extra-", ""));
      else if (id.indexOf("seo") === 0) html += seoHtml();
    }
    var headerOn = cfg.layout.filter(function (s) { return s.id === "header"; })[0];
    if (el("site-header")) el("site-header").classList.toggle("hidden", headerOn && headerOn.enabled === false);
    var footerOn = cfg.layout.filter(function (s) { return s.id === "footer"; })[0];
    if (!footerOn || footerOn.enabled !== false) html += footerHtml();
    el("section-flow").innerHTML = html;
    fillAds();
    updateResultsOnly();
    bindPublic();
    applySeo();
    applyCustomCode();
    renderCookie();
    var lh = (location.hash || "").replace(/^#/, "");
    var lmap = { privacy: "privacy", terms: "terms", cookies: "cookies", disclaimer: "disclaimer", advertising: "ads" };
    if (lmap[lh]) selectLegalTab(lmap[lh], false);
  }

  function resultText() {
    var r = compute();
    if (r.empty || r.error) return "";
    var cur = currentCurrency();
    var L = state.cfg.calculator.labels;
    return [
      state.cfg.site.name,
      L.subtotal + ": " + formatMoney(r.bill),
      L.tax + " (" + r.taxPct + "%): " + formatMoney(r.tax),
      L.tip + " (" + r.tipPct + "%): " + formatMoney(r.tip),
      L.total + ": " + formatMoney(r.total),
      L.people + ": " + r.people,
      L.perPerson + ": " + formatMoney(r.per),
      "Currency: " + cur.code
    ].join("\n");
  }
  function updateResultsOnly() {
    var box = qs(".results-card");
    if (box) box.innerHTML = resultsInner();
    var r = compute();
    var hp = el("hero-preview-total");
    var hs = el("hero-preview-sub");
    if (hp) hp.textContent = r.empty || r.error ? "—" : formatMoney(r.total);
    if (hs) hs.textContent = r.empty ? "Waiting for a bill amount" : (r.error || (r.people + " people · " + formatMoney(r.per) + " each"));
    var err = el("calc-error");
    if (err) err.textContent = r.error || "";
    var share = el("social-share");
    if (share && !r.empty && !r.error) {
      var text = encodeURIComponent(resultText());
      var url = encodeURIComponent((state.cfg.seo.siteUrl || location.href.split("#")[0]).replace(/\/?index\.html$/i, ""));
      share.innerHTML =
        '<a class="btn btn-sm btn-ghost" target="_blank" rel="noopener noreferrer" href="https://www.facebook.com/sharer/sharer.php?u=' + url + '">Facebook</a>' +
        '<a class="btn btn-sm btn-ghost" target="_blank" rel="noopener noreferrer" href="https://twitter.com/intent/tweet?text=' + text + '">X</a>' +
        '<a class="btn btn-sm btn-ghost" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=' + text + '">WhatsApp</a>' +
        '<a class="btn btn-sm btn-ghost" href="mailto:?subject=' + encodeURIComponent("Tip calculation") + "&body=" + text + '">Email</a>' +
        '<button class="btn btn-sm btn-ghost" type="button" id="copy-link">Copy link</button>';
    }
    bindResultButtons();
  }

  function trackCalcUse() {
    var now = Date.now();
    if (now - state.lastCalcAt < 800) return;
    var r = compute();
    if (r.empty || r.error) return;
    state.lastCalcAt = now;
    bumpStat("calc");
    gtagEvent("calculator_used");
    gtagEvent("tip_calculated", { currency: state.calc.currency, tip: Number(state.calc.tip) });
  }

  function bindPublic() {
    var bill = el("bill-amount");
    if (bill) bill.addEventListener("input", function () { state.calc.bill = bill.value; updateResultsOnly(); trackCalcUse(); });
    var cur = el("currency");
    if (cur) cur.addEventListener("change", function () { state.calc.currency = cur.value; updateResultsOnly(); });
    var tax = el("tax-pct");
    if (tax) tax.addEventListener("input", function () { state.calc.tax = tax.value; updateResultsOnly(); trackCalcUse(); });
    qsa("[data-tip]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.getAttribute("data-tip") === "custom") {
          state.calc.custom = true;
          var ctw = el("custom-tip-wrap"); if (ctw) ctw.classList.remove("hidden");
        } else {
          state.calc.custom = false;
          state.calc.tip = Number(b.getAttribute("data-tip"));
          var wrap = el("custom-tip-wrap"); if (wrap) wrap.classList.add("hidden");
        }
        qsa("[data-tip]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        updateResultsOnly(); trackCalcUse();
      });
    });
    var ct = el("custom-tip");
    if (ct) ct.addEventListener("input", function () { state.calc.tip = ct.value; state.calc.custom = true; updateResultsOnly(); trackCalcUse(); });
    qsa("[data-tipon]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.calc.tipOn = b.getAttribute("data-tipon");
        qsa("[data-tipon]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        updateResultsOnly(); trackCalcUse();
      });
    });
    qsa("[data-people]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.getAttribute("data-people") === "custom") {
          state.calc.peopleCustom = true;
          var pw = el("custom-people-wrap"); if (pw) pw.classList.remove("hidden");
        } else {
          state.calc.peopleCustom = false;
          state.calc.people = Number(b.getAttribute("data-people"));
          var wrap = el("custom-people-wrap"); if (wrap) wrap.classList.add("hidden");
        }
        qsa("[data-people]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        updateResultsOnly(); trackCalcUse();
      });
    });
    var cp = el("custom-people");
    if (cp) cp.addEventListener("input", function () { state.calc.people = cp.value; state.calc.peopleCustom = true; updateResultsOnly(); trackCalcUse(); });
    var rnd = el("rounding");
    if (rnd) rnd.addEventListener("change", function () { state.calc.rounding = Number(rnd.value); updateResultsOnly(); });
    qsa("[data-legal-tab]").forEach(function (b) {
      b.addEventListener("click", function () {
        selectLegalTab(b.getAttribute("data-legal-tab"), false);
      });
    });
    qsa(".faq-item button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var item = btn.parentElement;
        var open = !item.classList.contains("open");
        qsa(".faq-item").forEach(function (i) { i.classList.remove("open"); qs("button", i).setAttribute("aria-expanded", "false"); });
        if (open) { item.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
      });
    });
    var form = el("contact-form");
    if (form) form.addEventListener("submit", onContact);
    qsa('a[href^="#"]').forEach(function (a) {
      a.addEventListener("click", function (e) {
        var id = a.getAttribute("href");
        if (!id || id === "#") return;
        if (id === "#admin") return;
        var legal = { "#privacy": "privacy", "#terms": "terms", "#cookies": "cookies", "#disclaimer": "disclaimer", "#advertising": "ads" };
        if (legal[id]) { e.preventDefault(); showLegal(legal[id]); return; }
        var target = qs(id);
        if (target) {
          e.preventDefault();
          showPublic();
          target.scrollIntoView({ behavior: document.body.classList.contains("reduce-motion") ? "auto" : "smooth", block: "start" });
          if (el("mobile-drawer")) { el("mobile-drawer").classList.remove("open"); el("mobile-drawer").hidden = true; }
        }
      });
    });
  }

  function bindResultButtons() {
    var copy = el("copy-result");
    if (copy) copy.addEventListener("click", async function () {
      var t = resultText();
      try { await navigator.clipboard.writeText(t); toast("Copied", "ok"); gtagEvent("copy_clicked"); }
      catch (e) { toast("Could not copy", "err"); }
    });
    var share = el("share-result");
    if (share) share.addEventListener("click", async function () {
      var t = resultText();
      gtagEvent("share_clicked");
      if (navigator.share) {
        try { await navigator.share({ title: state.cfg.site.name, text: t }); return; } catch (e) {}
      }
      try { await navigator.clipboard.writeText(t); toast("Share not available — result copied instead", "ok"); }
      catch (e) { toast("Sharing is not available in this browser", "err"); }
    });
    var pr = el("print-result");
    if (pr) pr.addEventListener("click", function () { window.print(); });
    var rs = el("reset-calc");
    if (rs) rs.addEventListener("click", function () {
      state.calc.bill = "";
      state.calc.tax = state.cfg.calculator.defaultTax;
      state.calc.tip = state.cfg.calculator.defaultTip;
      state.calc.custom = false;
      state.calc.people = state.cfg.calculator.defaultPeople;

  async function onContact(e) {

      if (status) status.textContent = "Enter a valid email address.";
      return;
    }
    if (c.endpoint) {
      try {
        var res = await fetch(c.endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error("fail");
        if (status) status.textContent = c.success;
        toast("Inquiry sent", "ok");
      } catch (err) {
        if (status) status.textContent = c.error;
        toast("Form endpoint failed", "err");
      }
      return;
    }
    if (!c.email) {
      if (status) status.textContent = "No contact email or form endpoint is configured. Set one in Admin → Contact Form.";
      return;
    }
    var body = encodeURIComponent((data.name ? "From: " + data.name + "\n" : "") + (data.email ? "Email: " + data.email + "\n\n" : "") + (data.message || ""));
    var sub = encodeURIComponent(data.subject || "Website inquiry");

    if (status) status.textContent = c.success;

  function setMeta(name, content, attr) {

  async function getRawHtmlSource() {
    var candidates = [location.href.split("#")[0], "index.html", "./index.html"];

        if (!res.ok) continue;
        var text = await res.text();

          var baked = injectPublished(await file.text(), cfg);

  async function downloadBakedIndex() {

  function applyDraftNow() {

      try { renderPublic(); } catch (e) {}
    }
  }
  async function saveDraft() {

  }

  function exportSettings() {
    var blob = new Blob([JSON.stringify({ version: APP.version, exportedAt: new Date().toISOString(), settings: state.draft }, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "website-settings.json";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("Backup exported", "ok");
  }
  function importSettings(e) {

    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var settings = data.settings || data;
        if (!settings.site || !settings.calculator || !settings.theme) throw new Error("Invalid file");
        state.draft = mergeDefaults(DEFAULTS, settings);
        markDirty();
        renderAdminPage();
        toast("Settings restored — save to publish", "ok");
      } catch (err) {
        toast("Invalid settings file", "err");
      }

    return over == null ? def : over;
  }

  async function changeCreds() {
    var user = el("new-user").value.trim();
    var cur = el("cur-pass").value;
    var n1 = el("new-pass").value;
    var n2 = el("new-pass2").value;
    var cred = getCred();
    var curHash = await hashCred(cred.user, cur);
    if (curHash !== cred.hash) { toast("Current password is incorrect", "err"); return; }
    if (n1 && n1 !== n2) { toast("New passwords do not match", "err"); return; }

    var nextPass = n1 || cur;
    if (nextPass.length < 8) { toast("Use at least 8 characters", "err"); return; }
    var h = await hashCred(nextUser, nextPass);
    setCred(nextUser, h);
    if (state.draft.security.encrypt) {
      var dk = await deriveKey(nextPass);
      lsSet("stc_salt_v1", dk.salt);
      state.cryptoKey = dk.key;
    }
    toast("Credentials updated", "ok");
  }

  function loginHtml() {
    return '<form class="login-card" id="login-form"><h1 id="login-title" style="margin:0 0 8px;font-size:1.5rem">Administrator</h1>' +
      '<p class="muted">Local dashboard for this browser. This is not server-side authentication. On GitHub Pages use <code>https://your-username.github.io/your-repo/#admin</code> — the public site does not show a link here.</p>' +
      '<div class="admin-field"><label for="lu">Username</label><input id="lu" autocomplete="username" required></div>' +
      '<div class="admin-field"><label for="lp">Password</label><div style="display:flex;gap:8px"><input id="lp" type="password" autocomplete="current-password" required style="flex:1"><button class="btn btn-secondary btn-sm" type="button" id="lp-tog">Show</button></div></div>' +
      '<p class="error-msg" id="login-err"></p>' +
      '<button class="btn btn-primary btn-block" type="submit">Sign in</button></form>';
  }

  function showLogin() {
    el("admin-login").classList.remove("hidden");
    el("admin-root").classList.add("hidden");
    el("admin-login").innerHTML = loginHtml();
    el("lp-tog").onclick = function () {
      var p = el("lp");
      p.type = p.type === "password" ? "text" : "password";
      el("lp-tog").textContent = p.type === "password" ? "Show" : "Hide";
    };
    el("login-form").onsubmit = onLogin;
  }
  async function onLogin(e) {
    e.preventDefault();
    var lock = JSON.parse(lsGet(APP.lockKey) || "null") || { n: 0, until: 0 };
    if (Date.now() < lock.until) {
      el("login-err").textContent = "Too many attempts. Try again later.";
      return;
    }
    var user = el("lu").value.trim();
    var pass = el("lp").value;
    var delay = Math.min(8000, 400 * Math.pow(2, lock.n));
    await new Promise(function (r) { setTimeout(r, delay); });

    var h = await hashCred(user, pass);
    if (user !== cred.user || h !== cred.hash) {

      var max = (state.cfg && state.cfg.security.lockAfter) || 5;
      if (lock.n >= max) lock.until = Date.now() + 5 * 60 * 1000;

      el("login-err").textContent = "Those details do not match.";
      return;

    lsDel(APP.lockKey);

      try {
        var raw = JSON.parse(lsGet(APP.cfgKey) || "null");
        if (raw && raw.enc) {
          var dk = await deriveKey(pass, raw.payload.salt || lsGet("stc_salt_v1"));
          state.cfg = await decryptJson(raw.payload, dk.key);
          state.cryptoKey = dk.key;
        }
      } catch (err) {
        el("login-err").textContent = "Could not decrypt settings with this password.";
        return;
      }
    }
    var mins = (state.cfg && state.cfg.security.sessionMinutes) || 30;
    var sess = { user: user, exp: Date.now() + mins * 60 * 1000 };
    ssSet(APP.sessionKey, JSON.stringify(sess));
    state.session = sess;
    el("admin-login").classList.add("hidden");
    openAdmin();
  }
  function openAdmin() {

    el("legal-root").classList.add("hidden");
    el("admin-root").classList.remove("hidden");
    el("admin-root").innerHTML = adminShell();
    state.draft = deepClone(state.cfg);
    try {
      var d = ssGet(APP.draftKey);
      if (d) { state.draft = JSON.parse(d); state.dirty = true; }
    } catch (e) {}
    renderAdminNav("");
    renderAdminPage();
    el("admin-q").oninput = function () { renderAdminNav(el("admin-q").value); };
    el("save-all").onclick = saveDraft;
    el("admin-preview").onclick = enterPreview;
    if (el("dl-live-config")) el("dl-live-config").onclick = downloadSiteConfig;
    var menu = el("admin-menu");
    if (menu) menu.onclick = function () { el("admin-side").classList.toggle("open"); };
  }
  function doLogout() {
    modal({ title: "Log out?", body: "Unsaved changes stay in this tab until it closes.", ok: "Log out", onok: function () {
      clearSession();
      el("admin-root").classList.add("hidden");
      el("admin-login").classList.add("hidden");
      el("public-root").classList.remove("hidden");
      history.replaceState(null, "", location.pathname + location.search);
      toast("Signed out", "ok");
    }});
  }
  function enterPreview() {
    state.preview = true;
    el("admin-root").classList.add("hidden");
    el("public-root").classList.remove("hidden");
    el("preview-bar").classList.remove("hidden");
    document.body.style.paddingTop = "44px";
    history.replaceState(null, "", "#preview");
  }
  function exitPreview() {
    state.preview = false;
    el("preview-bar").classList.add("hidden");
    document.body.style.paddingTop = "";
    if (sessionOk()) openAdmin();
    history.replaceState(null, "", "#admin");
  }

  /* ===================== ROUTING ===================== */
  function route() {
    var h = (location.hash || "").replace(/^#/, "");
    if (h === "admin" || h.indexOf("admin/") === 0) {
      if (sessionOk()) openAdmin(); else showLogin();
      return;
    }
    if (h === "preview") { if (sessionOk()) enterPreview(); else showPublic(); return; }
    var legal = { privacy: "privacy", terms: "terms", cookies: "cookies", disclaimer: "disclaimer", advertising: "ads" };
    if (legal[h]) { showLegal(legal[h]); return; }
    showPublic();
  }

  /* ===================== LOAD CONFIG ===================== */
  function readPublishedConfig() {
    try {
      var n = el("published-config");
      if (!n || !n.textContent) return null;
      var j = JSON.parse(n.textContent);
      if (!j || j === null) return null;
      var settings = j.settings || j;
      if (!settings || !settings.site) return null;
      return mergeDefaults(DEFAULTS, settings);
    } catch (e) { return null; }
  }
  async function loadLocalCfg() {

    try {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.enc) {
        if (state.cryptoKey) {
          try { return mergeDefaults(DEFAULTS, await decryptJson(parsed.payload, state.cryptoKey)); }
          catch (e) { return null; }
        }

      }
      return mergeDefaults(DEFAULTS, parsed.data || parsed);
    } catch (e) { return null; }
  }
  async function loadConfig() {

    var local = await loadLocalCfg();

    if (published) return published;
    if (local) return local;
    return deepClone(DEFAULTS);
  }

  /* ===================== INIT ===================== */
  function bindChrome() {

      applyTheme(state.cfg);
      try {
        var raw = lsGet(APP.cfgKey);
        var parsed = raw ? JSON.parse(raw) : null;
        if (!parsed || !parsed.enc) lsSet(APP.cfgKey, JSON.stringify({ enc: false, data: state.cfg }));
      } catch (e) {}
      el("theme-toggle").innerHTML = document.documentElement.getAttribute("data-theme") === "dark" ? iconSun() : iconMoon();
    };
    el("menu-toggle").onclick = function () {

      var open = !d.classList.contains("open");
      d.classList.toggle("open", open);
      d.hidden = !open;
      el("menu-toggle").setAttribute("aria-expanded", String(open));
    };
    el("exit-preview").onclick = exitPreview;
    document.addEventListener("click", function () { if (state.session) touchSession(); });
    window.addEventListener("hashchange", route);
    setInterval(function () {
      if (el("admin-root") && !el("admin-root").classList.contains("hidden") && !sessionOk()) {
        clearSession();
        showLogin();
        toast("Session timed out", "err");
      }
    }, 30000);
  }

  async function init() {
    try {
      state.cfg = await loadConfig();
      state.calc.tip = state.cfg.calculator.defaultTip;
      state.calc.tax = state.cfg.calculator.defaultTax;
      state.calc.people = state.cfg.calculator.defaultPeople;
      state.calc.rounding = state.cfg.calculator.defaultRounding;
      state.calc.currency = state.cfg.calculator.defaultCurrency;
      state.calc.tipOn = state.cfg.calculator.defaultTipOn || "before";
      applyTheme(state.cfg);
      renderPublic();
      bindChrome();
      bumpStat("visit");
      gtagEvent("page_view");
      injectGA4();
      route();
    } catch (e) {
      console.error(e);
      document.body.insertAdjacentHTML("afterbegin", '<div class="cookie" style="position:relative;margin:16px auto"><strong>Something went wrong loading this page.</strong><p>Try refreshing. If settings are corrupt, clear this site’s local data from your browser.</p></div>');

  else init();
